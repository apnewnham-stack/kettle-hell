plugins { id 'com.android.application' version '8.7.3' }

android {
    namespace 'com.kettlehell.launcher'
    compileSdk 35
    defaultConfig {
        applicationId 'com.kettlehell.launcher'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }
    signingConfigs {
        kh {
            storeFile file('launcher.keystore')
            storePassword 'kettlehell'
            keyAlias 'kh'
            keyPassword 'kettlehell'
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.kh; minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
