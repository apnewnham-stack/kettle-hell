name: Build Android launcher
on:
  push:
    paths: ['android-launcher/**', '.github/workflows/android-launcher.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install SDK parts
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - name: Build APK
        run: android-launcher/build.sh
      - name: Publish to release "launcher"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view launcher >/dev/null 2>&1 || \
            gh release create launcher --target "$GITHUB_SHA" --title "Kettle Hell Android launcher" \
              --notes "Tap-to-open shortcut for the Kettle Hell app. Download KettleHell.apk on your phone and install it."
          gh release upload launcher android-launcher/build/KettleHell.apk --clobber
      - uses: actions/upload-artifact@v4
        with: { name: KettleHell-apk, path: android-launcher/build/KettleHell.apk }
