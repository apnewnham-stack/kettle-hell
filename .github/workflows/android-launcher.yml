name: Build Android launcher
on:
  push:
    paths: ['android-launcher/**', '.github/workflows/android-launcher.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Build APK
        working-directory: android-launcher
        run: |
          gradle --no-daemon assembleRelease
          cp build/outputs/apk/release/*-release.apk build/KettleHell.apk
          "$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner" verify --print-certs build/KettleHell.apk
      - name: Publish to release "launcher"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view launcher >/dev/null 2>&1 || \
            gh release create launcher --target "$GITHUB_SHA" --title "Kettle Hell Android app" \
              --notes "Kettle Hell for Android. Download KettleHell.apk on your phone and install it."
          gh release upload launcher android-launcher/build/KettleHell.apk --clobber
      - uses: actions/upload-artifact@v4
        with: { name: KettleHell-apk, path: android-launcher/build/KettleHell.apk }
